[workspace]
authors = ["Ryan Volz <rvolz@mit.edu>"]
channels = ["https://prefix.dev/conda-forge"]
name = "maia-waterfall"
platforms = ["linux-64", "linux-aarch64", "osx-arm64", "osx-64", "win-64"]
preview = ["pixi-build"]

[environments]
default = { features = ["js", "widget"], solve-group = "default" }
js = { features = ["js"], solve-group = "default", no-default-feature = true }
js-dev = { features = ["js-dev"], solve-group = "default", no-default-feature = true }
widget = { features = ["widget"], solve-group = "default", no-default-feature = true }
widget-dev = { features = ["widget-dev"], solve-group = "default", no-default-feature = true }

[tasks]
clean-build = "pixi clean --build"

[feature.js.dependencies]
maia-waterfall-js = { path = "packages/js" }

[feature.js.tasks.js-build]
cmd = "echo Built!"
description = "Dummy task so that other tasks can depend on the built environment"
default-environment = "js"

[feature.js-dev.dev]
maia-waterfall-js = { path = "packages/js" }

[feature.js-dev.tasks.cargo-update]
cmd = "cargo update --manifest-path packages/js/Cargo.toml"
description = "Update rust dependencies"

[feature.js-dev.tasks.npm-publish]
cmd = "npm publish ./.pixi/envs/default/lib/node_modules/maia-waterfall"
depends-on = [{ task = "js-build", environment = "default" }]
description = "Publish maia-waterfall Javascript package to npm"

[feature.widget.dependencies]
jupyterlab = "*"
maia-waterfall-widget = { path = "packages/widget" }
pillow = "*"

[feature.widget.tasks.example-widget]
cmd = "jupyter lab example.ipynb"
cwd = "examples"
description = "Open example notebook demonstrating maia_waterfall_widget"

[feature.widget-dev.dependencies]
maia-waterfall-js = { path = "packages/js" }

[feature.widget-dev.dev]
maia-waterfall-widget = { path = "packages/widget" }

[feature.widget-dev.tasks.lock-update-widget]
cmd = "npm update --package-lock-only"
cwd = "packages/widget"
description = "Update widget package-lock.json"

[feature.widget-dev.tasks.build-widget-js]
cmd = "npm install && npm link maia-waterfall && npm run build"
cwd = "packages/widget"
description = "Bundle maia-waterfall-widget javascript module"

[feature.widget-dev.tasks.build-widget-wheel]
cmd = "uv build --out-dir dist packages/widget"
depends-on = ["build-widget-js"]
description = "Build maia-waterfall-widget wheel and sdist"
