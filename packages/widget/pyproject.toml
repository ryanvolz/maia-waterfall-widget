[project]
authors = [{name = "Ryan Volz", email = "rvolz@mit.edu"}]
dependencies = ["anywidget>=0.11", "numpy"]
name = "maia_waterfall_widget"
requires-python = ">= 3.11"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-APACHE", "LICENSE-MIT"]
readme = "README.md"
# Remember to also update the version in recipe.yaml
version = "0.2.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build]
only-packages = true
artifacts = ["maia_waterfall_widget/static/*"]
