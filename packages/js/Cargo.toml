[package]
name = "maia-waterfall"
# Remember to also update the version in recipe.yaml
# Probably a good idea to run `pixi run cargo-update` too
version = "0.2.0"
edition = "2024"
authors = ["Ryan Volz <rvolz@mit.edu>"]
description = "Spectral waterfall display in a canvas, derived from Maia SDR"
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/ryanvolz/maia-waterfall"

[lib]
crate-type = ["cdylib"]

[dependencies]
jpeg-decoder = { version = "0.3", default-features = false }
js-sys = "0.3"
paste = "1"
maia-wasm = { git = "https://github.com/ryanvolz/maia-sdr.git", branch = "waterfall-custom" }
wasm-bindgen = "0.2"
realfft = "3.5.0"
itertools = "0.15.0"

[dependencies.web-sys]
version = "0.3.72"
features = [
  'HtmlCanvasElement',
]

[profile.release]
codegen-units = 1
lto = true
